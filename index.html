<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagarto.fun</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Lagarto.fun</h1>
  <div class="game-section">
    <h2>Clicker</h2>
    <p>Cliques: <span id="click-count">0</span></p>
    <button id="click-btn">Clicar</button>
  </div>

  <div class="game-section">
    <h2>Tempo de Reação</h2>
    <p id="reaction-text">Clique em "Iniciar" e espere o verde!</p>
    <button id="start-reaction">Iniciar</button>
    <div id="reaction-area"></div>
    <p>Resultado: <span id="reaction-result">--</span> ms</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
